<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retarget viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #202020; color: #eee; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel { position: absolute; top: 10px; right: 10px; width: 300px; max-height: calc(100% - 20px); overflow: auto;
           background: rgba(0,0,0,.65); border-radius: 8px; padding: 10px 12px; box-sizing: border-box; }
  #panel h3 { margin: 8px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #9cf; }
  #panel label { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #panel label span { flex: 0 0 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel input[type=range] { flex: 1; min-width: 0; }
  #panel select, #panel button { width: 100%; margin: 2px 0; }
  #status { font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; color: #bbb; }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  #rigBox { border: 1px solid #3c5a78; border-radius: 6px; padding: 8px; margin: 4px 0 6px; background: rgba(40,70,100,.25); }
  #rigInfo { margin-bottom: 6px; color: #ddd; }
  #rigBox button.primary { background: #2f6f4a; border: 1px solid #3d8a5d; color: #fff; padding: 6px; border-radius: 4px; cursor: pointer; }
  #rigBox button.pick { background: #9a6414; border-color: #c08a2e; color: #fff; }
  #rigBox button:disabled { opacity: .5; cursor: default; }
  #rigBox a { color: #9cf; font-size: 12px; }
  #rigLog { font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; color: #aaa; margin-top: 6px; }
  #rigLog:empty, #rigMore:empty { display: none; }
  #inputBox { border: 1px solid #3c5a78; border-radius: 6px; padding: 8px; margin: 4px 0 6px; background: rgba(40,70,100,.25); }
  .seg { display: flex; border: 1px solid #4a6a88; border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
  #panel .seg label { flex: 1; margin: 0; justify-content: center; padding: 6px 0; cursor: pointer; color: #bbb; user-select: none; }
  #panel .seg label + label { border-left: 1px solid #4a6a88; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  #panel .seg label:has(input:checked) { background: #2f6f4a; color: #fff; font-weight: 600; }
  #inputHelp { color: #ccc; font-size: 12px; }
  #panel label b { flex: 0 0 38px; text-align: right; font: 11px ui-monospace, monospace; color: #ccc; }
  #sliderArea.off label { opacity: .35; }
  #sliderArea.off h3 { color: #567; }

</style>
</head>
<body>
<div id="panel">
  <h3>Model</h3>
  <select id="modelSelect"></select>
  <div class="row"><button id="loadBtn">Load</button><button id="bgBtn">Background</button><button id="resetBtn">Reset pose</button></div>
  <label><span title="extra EMA per render tick; capture already applies a One Euro filter">Extra smoothing</span><input id="smooth" type="range" min="0" max="0.95" step="0.05" value="0"><b id="smoothVal">0.00</b></label>
  <label><span>Mirror in viewer</span><input id="mirror" type="checkbox"></label>
  <h3>Face rig</h3>
  <div id="rigBox">
    <div id="rigInfo">…</div>
    <button id="rigAction" class="primary" hidden></button>
    <div id="rigMore"></div>
    <div id="rigLog"></div>
  </div>
  <h3>Input</h3>
  <div id="inputBox">
    <div class="seg" role="radiogroup" aria-label="what drives the model">
      <label title="follow the frames from the capture process (webcam or video)"><input type="radio" name="src" id="srcLive" checked>Live capture</label>
      <label title="move the model by hand with the sliders, no camera needed"><input type="radio" name="src" id="manual">Sliders</label>
    </div>
    <div id="inputHelp"></div>
  </div>
  <h3>Status</h3>
  <div id="status">connecting…</div>
  <div id="sliderArea">
    <div class="row"><button id="zeroBtn" title="set every slider to 0 (neutral face, head straight)">Zero all sliders</button></div>
    <h3>Head / gaze</h3>
    <div id="poseSliders"></div>
    <h3>Canonical inputs (ARKit 52)</h3>
    <div id="bsSliders"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script>
<script src="rigjob.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import Stats from 'three/addons/libs/stats.module.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const ARKIT_52 = ['eyeBlinkLeft','eyeLookDownLeft','eyeLookInLeft','eyeLookOutLeft','eyeLookUpLeft','eyeSquintLeft','eyeWideLeft',
  'eyeBlinkRight','eyeLookDownRight','eyeLookInRight','eyeLookOutRight','eyeLookUpRight','eyeSquintRight','eyeWideRight',
  'jawForward','jawLeft','jawRight','jawOpen','mouthClose','mouthFunnel','mouthPucker','mouthLeft','mouthRight',
  'mouthSmileLeft','mouthSmileRight','mouthFrownLeft','mouthFrownRight','mouthDimpleLeft','mouthDimpleRight',
  'mouthStretchLeft','mouthStretchRight','mouthRollLower','mouthRollUpper','mouthShrugLower','mouthShrugUpper',
  'mouthPressLeft','mouthPressRight','mouthLowerDownLeft','mouthLowerDownRight','mouthUpperUpLeft','mouthUpperUpRight',
  'browDownLeft','browDownRight','browInnerUp','browOuterUpLeft','browOuterUpRight','cheekPuff','cheekSquintLeft',
  'cheekSquintRight','noseSneerLeft','noseSneerRight','tongueOut'];
const BONE_ALIASES = {
  head: ['頭','Head','head','mixamorig:Head','J_Bip_C_Head','Bip01 Head','CC_Base_Head'],
  leftEye: ['左目','LeftEye','Eye_L','eye_L','eye.L','mixamorig:LeftEye','J_Adj_L_FaceEye'],
  rightEye: ['右目','RightEye','Eye_R','eye_R','eye.R','mixamorig:RightEye','J_Adj_R_FaceEye'],
};
const DEG = Math.PI / 180;

// ---------------------------------------------------------------- scene
let renderer, scene, camera, controls, stats, clock;
let model = null;            // { root, vrm, morphTargets: Map<name, [{mesh, index}]>, bones: {head, leftEye, leftEye}, adapter, restQuat }
let bgIndex = 0;
const BACKGROUNDS = [0x202020, 0xffffff, 0x00ff00];
const smoothed = { head: [0, 0, 0], gaze: [0, 0], bs: {} };
let lastFrame = null, framesReceived = 0, lastFpsTime = performance.now(), recvFps = 0;

function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(BACKGROUNDS[0]);
  scene.add(new THREE.AmbientLight(0xffffff, 1.2));
  const dir = new THREE.DirectionalLight(0xffffff, 1.5);
  dir.position.set(0.5, 1, 1.5);
  scene.add(dir);

  camera = new THREE.PerspectiveCamera(25, window.innerWidth / window.innerHeight, 0.01, 50);
  camera.position.set(0, 1.5, 1.2);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.5, 0);
  controls.update();

  stats = new Stats();
  stats.dom.style.left = '10px';
  document.body.appendChild(stats.dom);
  clock = new THREE.Clock();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  renderer.setAnimationLoop(tick);
}

// ---------------------------------------------------------------- loading
const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));

async function loadModel(url, adapterUrl) {
  if (model) {
    scene.remove(model.root);
    if (model.vrm) VRMUtils.deepDispose(model.vrm.scene);
  }
  model = null;
  setStatus(`loading ${url} …`);
  const gltf = await loader.loadAsync(url);
  const vrm = gltf.userData.vrm || null;
  const root = vrm ? vrm.scene : gltf.scene;
  if (vrm) {
    VRMUtils.removeUnnecessaryVertices(root);
    VRMUtils.combineSkeletons(root);
  }
  scene.add(root);

  // morph targets: name -> [{mesh, index}]
  const morphTargets = new Map();
  root.traverse(o => {
    if (o.isMesh && o.morphTargetDictionary) {
      for (const [name, index] of Object.entries(o.morphTargetDictionary)) {
        if (!morphTargets.has(name)) morphTargets.set(name, []);
        morphTargets.get(name).push({ mesh: o, index });
      }
    }
  });

  let adapter = null;
  if (adapterUrl) {
    try { adapter = await (await fetch(adapterUrl)).json(); } catch (e) { console.warn('no adapter', e); }
  }
  if (!adapter) adapter = fallbackAdapter(morphTargets, vrm);

  const bones = {};
  for (const sem of ['head', 'leftEye', 'rightEye']) {
    let node = null;
    if (vrm) node = vrm.humanoid.getNormalizedBoneNode(sem);
    if (!node) {
      const names = [adapter.bones?.[sem], ...(BONE_ALIASES[sem] || [])].filter(Boolean);
      // GLTFLoader strips reserved characters from node names (mixamorig:Head -> mixamorigHead)
      for (const n of names) { node = root.getObjectByName(n) || root.getObjectByName(THREE.PropertyBinding.sanitizeNodeName(n)); if (node) break; }
    }
    bones[sem] = node || null;
  }
  const restQuat = {};
  for (const [sem, node] of Object.entries(bones)) if (node) restQuat[sem] = node.quaternion.clone();

  if (new URLSearchParams(location.search).get('lit') === '1') makeLit(root);
  frameCameraOn(root, bones.head);
  model = { root, vrm, morphTargets, bones, adapter, restQuat, rootRestQuat: root.quaternion.clone() };
  loadedName = url.split('/').pop().replace(/\.(glb|vrm)$/, '');
  refreshRig();
  window.viewer = { model, camera, controls, renderer, THREE, cameraInfo };
  resetSliders();
  const cov = adapter.coverageSummary ? `${adapter.coverageSummary.covered}/${adapter.coverageSummary.total}` : 'n/a';
  setStatus(`loaded ${url}\nvrm: ${vrm ? vrm.meta?.metaVersion || 'yes' : 'no'}  morph targets: ${morphTargets.size}\n` +
            `bones: head=${bones.head?.name || '-'} L=${bones.leftEye?.name || '-'} R=${bones.rightEye?.name || '-'}\n` +
            `adapter entries: ${adapter.entries.length}  coverage: ${cov}`);
}

function fallbackAdapter(morphTargets, vrm) {
  // ARKit-named morph targets drive themselves; nothing else is known client-side.
  const entries = [];
  for (const name of morphTargets.keys()) {
    const base = name.replace('_L', 'Left').replace('_R', 'Right');
    if (ARKIT_52.includes(base)) entries.push({ kind: 'morph', target: name, inputs: [base], combine: 'max', gain: 1 });
  }
  if (vrm && vrm.expressionManager) {
    const presets = { aa: ['jawOpen'], ih: ['mouthStretchLeft', 'mouthStretchRight'], ou: ['mouthPucker'], oh: ['mouthFunnel'],
      blink: ['eyeBlinkLeft', 'eyeBlinkRight'], happy: ['mouthSmileLeft', 'mouthSmileRight'], angry: ['browDownLeft', 'browDownRight'] };
    for (const [p, inputs] of Object.entries(presets)) {
      if (vrm.expressionManager.getExpression(p)) entries.push({ kind: 'vrmExpression', target: p, inputs, combine: p === 'blink' ? 'min' : 'mean', gain: 1 });
    }
    entries.push({ kind: 'vrmExpression', target: 'blinkLeft', inputs: ['eyeBlinkLeft', 'eyeBlinkRight'], combine: 'diff', gain: 1 });
    entries.push({ kind: 'vrmExpression', target: 'blinkRight', inputs: ['eyeBlinkRight', 'eyeBlinkLeft'], combine: 'diff', gain: 1 });
  }
  return { version: 1, bones: {}, entries, headMode: 'auto', gazeMode: 'auto' };
}

// Replace unlit (toon) materials with shaded ones; renders used for landmark
// detection need shading or the face is a flat silhouette.
function makeLit(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const out = mats.map(m => {
      if (!m || !m.isMeshBasicMaterial) return m;
      const n = new THREE.MeshLambertMaterial({ map: m.map || null, color: m.color, side: m.side,
        transparent: m.transparent, alphaTest: m.alphaTest, opacity: m.opacity });
      n.morphTargets = true;
      return n;
    });
    o.material = Array.isArray(o.material) ? out : out[0];
  });
}

// Camera description sufficient to unproject pixels on the Python side.
function cameraInfo() {
  const t = controls.target;
  return { position: camera.position.toArray(), target: [t.x, t.y, t.z], up: camera.up.toArray(),
           fov: camera.fov, aspect: camera.aspect, width: renderer.domElement.width, height: renderer.domElement.height,
           pixelRatio: renderer.getPixelRatio() };
}

function frameCameraOn(root, headBone) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  let target, headHeight;
  if (headBone) {
    target = new THREE.Vector3();
    headBone.getWorldPosition(target);
    headHeight = Math.max(0.12, (box.max.y - target.y) * 1.4);   // head bone sits near the chin/neck
    target.y += headHeight * 0.3;
  } else {
    target = box.getCenter(new THREE.Vector3());
    headHeight = size.y;
  }
  // fit the head into ~55% of the viewport height
  const dist = headHeight / (2 * Math.tan(camera.fov * DEG / 2)) / 0.55;
  camera.position.set(target.x, target.y, target.z + dist);
  controls.target.copy(target);
  controls.update();
}

// ---------------------------------------------------------------- applying a frame
function combine(op, values) {
  if (!values.length) return 0;
  switch (op) {
    case 'min': return Math.min(...values);
    case 'mean': return values.reduce((a, b) => a + b, 0) / values.length;
    case 'diff': return Math.max(0, values[0] - Math.max(0, ...values.slice(1)));
    default: return Math.max(...values);
  }
}

function applyFrame(frame) {
  if (!model) return;
  const mirror = document.getElementById('mirror').checked;
  const bs = {};
  for (const n of ARKIT_52) {
    const src = mirror ? mirrorName(n) : n;
    bs[n] = frame.bs?.[src] ?? 0;
  }
  const head = frame.head || [0, 0, 0];
  const gaze = frame.gaze || [0, 0];
  const h = mirror ? [head[0], -head[1], -head[2]] : head;
  const g = mirror ? [gaze[0], -gaze[1]] : gaze;

  const a = 1 - parseFloat(document.getElementById('smooth').value);
  for (let i = 0; i < 3; i++) smoothed.head[i] += (h[i] - smoothed.head[i]) * a;
  for (let i = 0; i < 2; i++) smoothed.gaze[i] += (g[i] - smoothed.gaze[i]) * a;
  for (const n of ARKIT_52) smoothed.bs[n] = (smoothed.bs[n] ?? 0) + (bs[n] - (smoothed.bs[n] ?? 0)) * a;

  // morphs / expressions
  const influence = new Map();
  for (const e of model.adapter.entries) {
    const v = Math.min(1, Math.max(0, combine(e.combine, e.inputs.map(i => smoothed.bs[i] ?? 0)) * (e.gain ?? 1)));
    const key = `${e.kind}:${e.target}`;
    influence.set(key, Math.max(influence.get(key) ?? 0, v));
  }
  for (const [key, v] of influence) {
    const [kind, target] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
    if (kind === 'vrmExpression' && model.vrm?.expressionManager) {
      model.vrm.expressionManager.setValue(target, v);
    } else {
      for (const { mesh, index } of model.morphTargets.get(target) || []) mesh.morphTargetInfluences[index] = v;
    }
  }

  // head
  const e = new THREE.Euler(smoothed.head[0] * DEG, smoothed.head[1] * DEG, smoothed.head[2] * DEG, 'XYZ');
  const q = new THREE.Quaternion().setFromEuler(e);
  if (model.bones.head) {
    model.bones.head.quaternion.copy(model.restQuat.head).multiply(q);
  } else {
    model.root.quaternion.copy(model.rootRestQuat).multiply(q);
  }
  // gaze
  const ge = new THREE.Euler(smoothed.gaze[0] * DEG, smoothed.gaze[1] * DEG, 0, 'XYZ');
  const gq = new THREE.Quaternion().setFromEuler(ge);
  for (const sem of ['leftEye', 'rightEye']) {
    if (model.bones[sem]) model.bones[sem].quaternion.copy(model.restQuat[sem]).multiply(gq);
  }
  if (model.vrm) model.vrm.update(clock.getDelta());
}

function mirrorName(n) {
  if (n.endsWith('Left')) return n.slice(0, -4) + 'Right';
  if (n.endsWith('Right')) return n.slice(0, -5) + 'Left';
  return n;
}

function tick() {
  stats.begin();
  const manual = document.getElementById('manual').checked;
  const frame = manual ? sliderFrame() : lastFrame;
  if (frame) applyFrame(frame);
  else if (model?.vrm) model.vrm.update(clock.getDelta());
  renderer.render(scene, camera);
  stats.end();
}

// ---------------------------------------------------------------- socket
const socket = io('/retarget');
// socket state goes on its own line: a model that loads before the socket connects keeps its
// 'loaded …' status (tools/screenshot_viewer.py and rig/render.py wait for that prefix)
let socketState = 'connecting…';
socket.on('connect', () => { socketState = 'socket connected'; refreshStatusLine(); });
socket.on('disconnect', () => { socketState = 'socket disconnected'; refreshStatusLine(); });
socket.on('frame', frame => {
  lastFrame = frame;
  framesReceived++;
  const now = performance.now();
  if (now - lastFpsTime > 1000) {
    recvFps = framesReceived * 1000 / (now - lastFpsTime);
    framesReceived = 0; lastFpsTime = now;
    document.getElementById('status').dataset.rx = recvFps.toFixed(1);
    refreshStatusLine();
  }
});

let statusBase = '';
function setStatus(s) { statusBase = s; refreshStatusLine(); }
function refreshStatusLine() {
  const el = document.getElementById('status');
  const ignored = document.getElementById('manual').checked ? ' (ignored: Input is Sliders)' : '';
  el.textContent = statusBase + `\n${socketState}` + (el.dataset.rx ? `  frames/s received: ${el.dataset.rx}${ignored}` : '');
}

// ---------------------------------------------------------------- UI
function sliderFrame() {
  const bs = {};
  for (const n of ARKIT_52) bs[n] = parseFloat(document.getElementById('bs_' + n).value);
  const v = id => parseFloat(document.getElementById(id).value);
  return { bs, head: [v('p_rx'), v('p_ry'), v('p_rz')], gaze: [v('p_gp'), v('p_gy')], src: 'sliders' };
}
function slider(parent, id, label, min, max, step, value) {
  const l = document.createElement('label');
  l.innerHTML = `<span title="${label}">${label}</span>`;
  const inp = document.createElement('input');
  Object.assign(inp, { type: 'range', id, min, max, step, value });
  const out = document.createElement('b');
  inp.addEventListener('input', () => showSliderValue(inp));
  l.append(inp, out);
  parent.appendChild(l);
  showSliderValue(inp);
}
function showSliderValue(inp) {
  const v = parseFloat(inp.value);
  inp.nextElementSibling.textContent = inp.step === '1' ? `${v}°` : v.toFixed(2);
}
function buildSliders() {
  const pose = document.getElementById('poseSliders');
  slider(pose, 'p_rx', 'head pitch (rx)', -40, 40, 1, 0);
  slider(pose, 'p_ry', 'head yaw (ry)', -60, 60, 1, 0);
  slider(pose, 'p_rz', 'head roll (rz)', -40, 40, 1, 0);
  slider(pose, 'p_gp', 'gaze pitch', -30, 30, 1, 0);
  slider(pose, 'p_gy', 'gaze yaw', -30, 30, 1, 0);
  const bsp = document.getElementById('bsSliders');
  for (const n of ARKIT_52) slider(bsp, 'bs_' + n, n, 0, 1, 0.01, 0);
}
function resetSliders() {
  for (const inp of document.querySelectorAll('#sliderArea input[type=range]')) { inp.value = 0; showSliderValue(inp); }
}
// Input source: live frames from the socket, or the sliders.  The sliders are disabled (greyed out)
// unless they drive the model, so moving one always has a visible effect.
function applyInputMode() {
  const manual = document.getElementById('manual').checked;
  const area = document.getElementById('sliderArea');
  area.classList.toggle('off', !manual);
  for (const inp of area.querySelectorAll('input[type=range]')) inp.disabled = !manual;
  document.getElementById('zeroBtn').disabled = !manual;
  document.getElementById('inputHelp').textContent = manual
    ? 'Sliders: move the model by hand to check each ARKit input, the head and the gaze without a camera. Frames from capture are ignored meanwhile.'
    : 'Live capture: the model follows the frames sent by the capture process (webcam or video). The sliders below are locked; pick Sliders to move the model by hand.';
  // back to live with no capture running: show the neutral face, not the last slider pose
  if (!manual && !lastFrame && model) applyFrame({ bs: {}, head: [0, 0, 0], gaze: [0, 0] });
  refreshStatusLine();
}
for (const id of ['srcLive', 'manual']) document.getElementById(id).addEventListener('change', applyInputMode);
document.getElementById('zeroBtn').addEventListener('click', resetSliders);
async function populateModels() {
  const sel = document.getElementById('modelSelect');
  const models = await (await fetch('api/models')).json();
  sel.innerHTML = '';
  for (const m of models) {
    const o = document.createElement('option');
    o.value = m.url; o.dataset.adapter = m.adapter || ''; o.dataset.name = m.name;
    o.textContent = `${m.name} (${m.size_mb} MB${m.adapter ? ', adapter' : ''})`;
    sel.appendChild(o);
  }
  return models;
}
document.getElementById('loadBtn').addEventListener('click', () => {
  const sel = document.getElementById('modelSelect');
  const opt = sel.selectedOptions[0];
  if (opt) loadModel(opt.value, opt.dataset.adapter || null).catch(e => setStatus('load failed: ' + e.message));
});
// ---------------------------------------------------------------- face rig (landmarks / generated blendshapes)
// Everything acts on the source model: "X.rigged" in the list means "X".  The server says where the
// model stands (RigJob.state) and the box offers only the next step for that state.
let loadedName = null, rigAction = null, watching = false;
function selectedBase() {
  const opt = document.getElementById('modelSelect').selectedOptions[0];
  if (!opt) return null;
  return { name: opt.dataset.name.replace(/\.rigged$/, ''), vrm: opt.value.endsWith('.vrm') };
}
function setRigAction(label, fn, cls = 'primary', disabled = false) {
  const b = document.getElementById('rigAction');
  b.hidden = !label; b.textContent = label || ''; b.className = cls; b.disabled = disabled;
  rigAction = fn;
}
function renderRig(st) {
  const info = document.getElementById('rigInfo'), more = document.getElementById('rigMore');
  more.innerHTML = '';
  document.getElementById('rigLog').textContent = RigJob.jobText(st);
  const cov = st.coverage ? `${st.coverage[0]}/${st.coverage[1]}` : '?';
  const busy = st.busy_with ? `Busy: generating ${st.busy_with}` : null;
  const editLink = title => {
    const a = document.createElement('a');
    a.href = `landmarks.html?model=${encodeURIComponent(st.model)}`; a.textContent = 'Edit landmarks…'; a.title = title;
    more.append(a);
  };
  switch (st.state) {
    case 'running':
      info.textContent = `Generating blendshapes for ${st.model}…`;
      setRigAction('Generating…', null, 'primary', true); break;
    case 'complete':
      info.textContent = `Its own morphs and bones cover ${cov} inputs: nothing to generate.`;
      setRigAction(null); break;
    case 'ready_auto':
      info.textContent = `Own morphs and bones cover ${cov} inputs. The rest can be generated (about 1 min; the face is found automatically).`;
      setRigAction(busy || 'Generate blendshapes', generate, 'primary', !!busy); break;
    case 'needs_landmarks':
      info.textContent = `Own morphs and bones cover ${cov} inputs. MediaPipe could not find a face in this model, so place the face points by hand first.`;
      setRigAction('Pick landmarks →', pickLandmarks, 'pick'); break;
    case 'ready':
      info.textContent = `Landmarks: ${RigJob.sourceText(st.landmarks)}. ` +
        (st.rigged ? 'They changed after the last generation.' : 'Blendshapes not generated yet.');
      setRigAction(busy || 'Generate blendshapes', generate, 'primary', !!busy);
      editLink('move or add points before generating'); break;
    case 'up_to_date': {
      const rc = st.rigged_coverage ? `${st.rigged_coverage[0]}/${st.rigged_coverage[1]}` : '?';
      info.textContent = `Generated ${st.rigged}: coverage ${cov} → ${rc}, from ${RigJob.sourceText(st.landmarks)}.`;
      if (loadedName === st.rigged) setRigAction(null);
      else setRigAction(`Load ${st.rigged}`, () => selectModel(st.rigged));
      editLink('if the generated shapes look wrong, correct the points and generate again'); break;
    }
  }
}
async function refreshRig() {
  const b = selectedBase();
  const info = document.getElementById('rigInfo');
  document.getElementById('rigLog').textContent = '';
  document.getElementById('rigMore').innerHTML = '';
  if (!b) { info.textContent = ''; setRigAction(null); return; }
  if (b.vrm) { info.textContent = 'VRM: expressions come from the file\'s own presets; nothing to generate.'; setRigAction(null); return; }
  let st;
  try { st = await RigJob.state(b.name); } catch (e) { info.textContent = String(e.message || e); setRigAction(null); return; }
  renderRig(st);
  if (st.state === 'running' && !watching) {                // a job started elsewhere (landmark page)
    watching = true;
    try { afterJob(await RigJob.watch(b.name, renderRig)); } finally { watching = false; }
  }
}
async function generate() {
  if (watching) return;
  const b = selectedBase();
  watching = true;
  let r;
  try { r = await RigJob.start(b.name, renderRig); } finally { watching = false; }
  if (r.refused) { await refreshRig(); document.getElementById('rigLog').textContent = r.refused; return; }
  afterJob(r);
}
async function afterJob(st) {
  if (st.state === 'up_to_date' && st.rigged) { await populateModels(); return selectModel(st.rigged); }
  renderRig(st);
}
function pickLandmarks() { location.href = `landmarks.html?model=${encodeURIComponent(selectedBase().name)}`; }
function selectModel(name) {
  const sel = document.getElementById('modelSelect');
  const opt = [...sel.options].find(o => o.dataset.name === name);
  if (!opt) return;
  sel.value = opt.value;
  loadModel(opt.value, opt.dataset.adapter || null).catch(e => setStatus('load failed: ' + e.message));
}
document.getElementById('rigAction').addEventListener('click', () => rigAction && rigAction());
document.getElementById('modelSelect').addEventListener('change', refreshRig);

document.getElementById('bgBtn').addEventListener('click', () => {
  bgIndex = (bgIndex + 1) % BACKGROUNDS.length;
  scene.background = new THREE.Color(BACKGROUNDS[bgIndex]);
});
document.getElementById('resetBtn').addEventListener('click', () => {
  resetSliders();
  lastFrame = null;
  if (model) applyFrame({ bs: {}, head: [0, 0, 0], gaze: [0, 0] });
});
document.getElementById('smooth').addEventListener('input', e => document.getElementById('smoothVal').textContent = parseFloat(e.target.value).toFixed(2));

init();
buildSliders();
applyInputMode();
{
  const params = new URLSearchParams(location.search);
  if (params.get('panel') === '0') document.getElementById('panel').style.display = 'none';
  if (params.get('stats') === '0') stats.dom.style.display = 'none';
}
populateModels().then(models => {
  const params = new URLSearchParams(location.search);
  const want = params.get('model');
  const pick = models.find(m => m.name === want) || models[0];
  if (pick) {
    document.getElementById('modelSelect').value = pick.url;
    loadModel(pick.url, pick.adapter).catch(e => setStatus('load failed: ' + e.message));
    refreshRig();
  } else setStatus('no models in web/models/ — run: python -m retarget.importer <model file>');
});
</script>
